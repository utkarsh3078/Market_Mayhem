# Render blueprint for the game server (Express + Socket.IO). The Next.js app deploys to Vercel.
# Render → New → Blueprint → pick this repo. Then set CLIENT_ORIGIN to the Vercel URL.
services:
  - type: web
    name: market-mayhem-server
    runtime: node
    plan: free # sleeps when idle: open /health ~10 minutes before a demo
    # Applies database migrations only when DATABASE_URL is configured.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && if [ -n "$DATABASE_URL" ]; then pnpm db:migrate; fi
    startCommand: pnpm start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Comma-separated web app origins, e.g. https://market-mayhem.vercel.app
      # The server refuses to start in production without it.
      - key: CLIENT_ORIGIN
        sync: false
      # Optional. Supabase "Session pooler" URL; when set, rounds/trades/results are saved.
      - key: DATABASE_URL
        sync: false
      # Recommended with Supabase: its CA certificate (PEM) for verified TLS.
      - key: DATABASE_CA_CERT
        sync: false
